name: AnythingLLM lemond builds

# Builds the lemond/lemonade embeddable binaries for every platform AnythingLLM Desktop ships:
#   macos-arm64, macos-x64, windows-x64, windows-arm64, linux-x64, linux-arm64
#
# Builds this fork at whichever branch the run is dispatched from. The fork carries no tags, so
# pass `version` to stamp a real version (written to .version, which tools/version.py prefers);
# otherwise the build gets a dev version (YYYY.WW.0~<count>.<hash>). Differences from the
# upstream embeddable jobs:
#   - Linux builds on Ubuntu 22.04 (glibc 2.35) with libstdc++/libgcc linked statically so the
#     binary runs on Ubuntu 22.04+, Debian 12+, RHEL 9+. OpenSSL stays dynamic (libssl.so.3) so
#     the distro's CA store/config is used.
#   - macOS pins the deployment target so the binary is not locked to the runner's macOS version.
#     Binaries are unsigned - electron-builder signs/notarizes them inside the .app.
#   - Windows ARM64 is built natively on windows-11-arm. Windows uses Ninja + the MSVC dev env so
#     the build does not depend on which Visual Studio version an image ships.
#   - Run manually only, with one checkbox per target (all on by default). Archives are left as
#     job artifacts (5 day retention).
#   - Builds only the lemond target (not the lemonade CLI or the upstream `embeddable` target) and
#     packages lemond + LICENSE + the resource files as lemond-<version>-<platform>.<ext>.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp, must start with X.Y.Z, e.g. 2026.40.0 (blank = dev version from git)"
        required: false
        default: ""
      macos_deployment_target:
        description: "Minimum macOS version (Electron 31 supports 11.0+)"
        required: true
        default: "11.0"
      macos_arm64:
        description: "Build macos-arm64"
        type: boolean
        default: true
      macos_x64:
        description: "Build macos-x64"
        type: boolean
        default: true
      windows_x64:
        description: "Build windows-x64"
        type: boolean
        default: true
      windows_arm64:
        description: "Build windows-arm64"
        type: boolean
        default: true
      linux_x64:
        description: "Build linux-x64"
        type: boolean
        default: true
      linux_arm64:
        description: "Build linux-arm64"
        type: boolean
        default: true

permissions:
  contents: read

env:
  LEMONADE_DISABLE_SYSTEMD_JOURNAL: "1"
  # Highest glibc symbol version the Linux binaries may require (Ubuntu 22.04)
  MAX_GLIBC: "2.35"
  # Resource files shipped next to lemond. Upstream embeddable omits architecture_defaults.json (per model
  # family sampler defaults) which lemond warns about, so it is added here.
  RESOURCES: >-
    defaults.json backend_versions.json server_models.json
    toolDefinitions.json vllm_model_config.json bench_scenarios.json architecture_defaults.json

jobs:
  # Turns the per-target checkboxes into a platform list per OS job; an OS job with nothing selected is
  # skipped. Only `platform` is in each matrix so job names read e.g. "Linux (linux-x64)" - runner, arch
  # and machine are looked up from it.
  targets:
    name: Select targets
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.select.outputs.linux }}
      macos: ${{ steps.select.outputs.macos }}
      windows: ${{ steps.select.outputs.windows }}
    steps:
      - id: select
        env:
          MACOS_ARM64: ${{ inputs.macos_arm64 }}
          MACOS_X64: ${{ inputs.macos_x64 }}
          WINDOWS_X64: ${{ inputs.windows_x64 }}
          WINDOWS_ARM64: ${{ inputs.windows_arm64 }}
          LINUX_X64: ${{ inputs.linux_x64 }}
          LINUX_ARM64: ${{ inputs.linux_arm64 }}
        run: |
          set -e
          pick() { if [ "$1" = "true" ]; then echo "$2"; fi; }
          list() { jq -nc '$ARGS.positional' --args "$@"; }
          linux=$(list $(pick "$LINUX_X64" linux-x64) $(pick "$LINUX_ARM64" linux-arm64))
          macos=$(list $(pick "$MACOS_ARM64" macos-arm64) $(pick "$MACOS_X64" macos-x64))
          windows=$(list $(pick "$WINDOWS_X64" windows-x64) $(pick "$WINDOWS_ARM64" windows-arm64))
          if [ "$linux$macos$windows" = "[][][]" ]; then
            echo "ERROR: no targets selected"; exit 1
          fi
          echo "linux=$linux" | tee -a "$GITHUB_OUTPUT"
          echo "macos=$macos" | tee -a "$GITHUB_OUTPUT"
          echo "windows=$windows" | tee -a "$GITHUB_OUTPUT"

  linux:
    name: Linux
    needs: targets
    if: ${{ needs.targets.outputs.linux != '[]' }}
    runs-on: ${{ fromJSON('{"linux-x64":"ubuntu-22.04","linux-arm64":"ubuntu-22.04-arm"}')[matrix.platform] }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.targets.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # dev versions count commits

      - name: Stamp version
        if: ${{ inputs.version != '' }}
        shell: bash
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "ERROR: version must start with X.Y.Z (got '${{ inputs.version }}')"; exit 1
          fi
          echo "${{ inputs.version }}" > .version

      - name: Get Lemonade version
        uses: ./.github/actions/get-version

      - name: Install build dependencies
        run: |
          set -e
          success=false
          for i in 1 2 3; do
            if sudo apt-get update && \
                sudo apt-get install -y ninja-build g++ pkg-config libssl-dev libdrm-dev; then
              success=true
              break
            fi
            echo "apt-get failed (attempt $i/3), retrying..."
            sleep 10
          done
          $success
          cmake --version
          g++ --version

      - name: Build lemond
        run: |
          set -e
          cmake --preset default -DBUILD_WEB_APP=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build --preset default --target lemond

      - name: Stage
        run: |
          set -e
          NAME="lemond-${LEMONADE_VERSION}-${{ matrix.platform }}"
          mkdir -p "dist/$NAME/resources"
          cp build/lemond LICENSE "dist/$NAME/"
          for r in $RESOURCES; do cp "build/resources/$r" "dist/$NAME/resources/"; done
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          find "dist/$NAME" -type f

      - name: Verify portability
        run: |
          set -e
          f="dist/$NAME/lemond"
          file "$f"
          readelf -d "$f" | grep NEEDED
          if readelf -d "$f" | grep -q 'libstdc++'; then
            echo "ERROR: $f dynamically links libstdc++"; exit 1
          fi
          max=$(objdump -T "$f" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "Max glibc symbol: $max (limit $MAX_GLIBC)"
          if [ "$(printf '%s\n%s\n' "$max" "$MAX_GLIBC" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
            echo "ERROR: $f requires glibc $max > $MAX_GLIBC"; exit 1
          fi
          "$f" --version

      - name: Package
        run: |
          set -e
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          tar -tzvf "dist/$NAME.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: lemond-${{ matrix.platform }}
          path: dist/*.tar.gz
          retention-days: 5

  macos:
    name: macOS
    needs: targets
    if: ${{ needs.targets.outputs.macos != '[]' }}
    runs-on: ${{ fromJSON('{"macos-arm64":"macos-15","macos-x64":"macos-15-intel"}')[matrix.platform] }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.targets.outputs.macos) }}
    env:
      ARCH: ${{ matrix.platform == 'macos-arm64' && 'arm64' || 'x86_64' }}
      MACOSX_DEPLOYMENT_TARGET: ${{ inputs.macos_deployment_target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # dev versions count commits

      - name: Stamp version
        if: ${{ inputs.version != '' }}
        shell: bash
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "ERROR: version must start with X.Y.Z (got '${{ inputs.version }}')"; exit 1
          fi
          echo "${{ inputs.version }}" > .version

      - name: Get Lemonade version
        uses: ./.github/actions/get-version

      - name: Install build dependencies
        run: |
          set -e
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi

      - name: Build lemond
        run: |
          set -e
          cmake --preset default -DBUILD_WEB_APP=OFF \
            -DCMAKE_OSX_ARCHITECTURES=$ARCH \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ inputs.macos_deployment_target }}
          cmake --build --preset default --target lemond

      - name: Stage
        run: |
          set -e
          NAME="lemond-${LEMONADE_VERSION}-${{ matrix.platform }}"
          mkdir -p "dist/$NAME/resources"
          cp build/lemond LICENSE "dist/$NAME/"
          for r in $RESOURCES; do cp "build/resources/$r" "dist/$NAME/resources/"; done
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          find "dist/$NAME" -type f

      - name: Verify binary
        run: |
          set -e
          f="dist/$NAME/lemond"
          file "$f"
          otool -L "$f"
          minos=$(otool -l "$f" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
          echo "minos: $minos (expected $MACOSX_DEPLOYMENT_TARGET)"
          if [ "$minos" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
            echo "ERROR: $f has minos $minos"; exit 1
          fi
          if otool -L "$f" | grep -E '/(opt/homebrew|usr/local)/'; then
            echo "ERROR: $f links Homebrew libraries"; exit 1
          fi
          "$f" --version

      - name: Package
        run: |
          set -e
          COPYFILE_DISABLE=1 tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          tar -tzvf "dist/$NAME.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: lemond-${{ matrix.platform }}
          path: dist/*.tar.gz
          retention-days: 5

  windows:
    name: Windows
    needs: targets
    if: ${{ needs.targets.outputs.windows != '[]' }}
    runs-on: ${{ fromJSON('{"windows-x64":"windows-latest","windows-arm64":"windows-11-arm"}')[matrix.platform] }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.targets.outputs.windows) }}
    env:
      ARCH: ${{ matrix.platform == 'windows-arm64' && 'arm64' || 'x64' }}
      # dumpbin machine type
      MACHINE: ${{ matrix.platform == 'windows-arm64' && 'AA64' || '8664' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # dev versions count commits

      - name: Stamp version
        if: ${{ inputs.version != '' }}
        shell: bash
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "ERROR: version must start with X.Y.Z (got '${{ inputs.version }}')"; exit 1
          fi
          echo "${{ inputs.version }}" > .version

      - name: Get Lemonade version
        uses: ./.github/actions/get-version

      - name: Set up MSVC (${{ env.ARCH }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ env.ARCH }}

      - name: Ensure CMake and Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            python -m pip install ninja
          }
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            python -m pip install cmake
          }
          cmake --version
          ninja --version

      - name: Build lemond
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_WEB_APP=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --target lemond -- -k 0 # report every compile error, not just the first
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage
        shell: bash
        run: |
          set -e
          NAME="lemond-${LEMONADE_VERSION}-${{ matrix.platform }}"
          mkdir -p "dist/$NAME/resources"
          cp build/lemond.exe LICENSE "dist/$NAME/"
          for r in $RESOURCES; do cp "build/resources/$r" "dist/$NAME/resources/"; done
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          find "dist/$NAME" -type f

      - name: Verify binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "dist\$($env:NAME)\lemond.exe"
          $headers = dumpbin /headers $path | Out-String
          if ($headers -notmatch "$($env:MACHINE) machine") { throw "lemond.exe is not a $($env:ARCH) binary" }
          dumpbin /dependents $path
          & $path --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path "dist\$($env:NAME)" -DestinationPath "dist\$($env:NAME).zip"
          Get-Item "dist\$($env:NAME).zip"

      - uses: actions/upload-artifact@v4
        with:
          name: lemond-${{ matrix.platform }}
          path: dist/*.zip
          retention-days: 5
